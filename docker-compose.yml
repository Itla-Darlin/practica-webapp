services: 
  web: 
    build: . 
    container_name: webapp-php 
    ports: 
      - "8080:80" 
    volumes: 
      - ./src:/var/www/html 
    depends_on: 
      - db 
  db: 
    image: mysql:8.0 
    container_name: webapp-mysql 
    environment: 
      MYSQL_ROOT_PASSWORD: rootpass 
      MYSQL_DATABASE: appdb 
      MYSQL_USER: appuser 
      MYSQL_PASSWORD: apppass 
    volumes: 
      - db_data:/var/lib/mysql 
volumes: 
  db_data:
